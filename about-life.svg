<rect x="32" y="70" width="548" height="390" rx="20" fill="#101321" stroke="#343851"/><path d="M32 92Q32 70 54 70H558Q580 70 580 92V112H32Z" fill="#191c2d"/>
<circle cx="53" cy="91" r="4" fill="#f472b6"/><circle cx="68" cy="91" r="4" fill="#fbbf24"/><circle cx="83" cy="91" r="4" fill="#34d399"/><rect x="118" y="81" width="315" height="20" rx="10" fill="#0d0e16" stroke="#343851"/><text x="134" y="95" class="mono" font-size="10" fill="#969bb8">paresh.dev / about</text>
<text x="60" y="151" font-size="22" font-weight="700" fill="#f5f6ff">Curious by default<tspan fill="#22d3ee"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>▍</tspan></text><text x="60" y="177" font-size="13" fill="#a2a6bd">Turning ideas into clean, working products.</text><text x="60" y="198" font-size="13" fill="#a2a6bd">From responsive interfaces to cloud automation.</text>
<rect x="60" y="226" width="48" height="48" rx="13" fill="#171a2b" stroke="#22d3ee"/><text x="84" y="256" text-anchor="middle" font-size="18" fill="#22d3ee"></></text><text x="124" y="245" font-size="14" font-weight="700" fill="#f5f6ff">Build</text><text x="124" y="263" font-size="12" fill="#9ea3bf">MERN apps & thoughtful UI</text><rect x="60" y="292" width="48" height="48" rx="13" fill="#171a2b" stroke="#a78bfa"/><text x="84" y="322" text-anchor="middle" font-size="18" fill="#a78bfa">⌘</text><text x="124" y="311" font-size="14" font-weight="700" fill="#f5f6ff">Automate</text><text x="124" y="329" font-size="12" fill="#9ea3bf">Cloud, CI/CD & repeatable workflows</text><rect x="60" y="358" width="48" height="48" rx="13" fill="#171a2b" stroke="#f472b6"/><text x="84" y="388" text-anchor="middle" font-size="18" fill="#f472b6">↗</text><text x="124" y="377" font-size="14" font-weight="700" fill="#f5f6ff">Keep learning</text><text x="124" y="395" font-size="12" fill="#9ea3bf">Vibe coding, experiments & shipping</text>
<rect x="600" y="70" width="568" height="390" rx="20" fill="#101321" stroke="#343851"/><text x="626" y="101" class="label" fill="#a78bfa">OFF THE CLOCK</text>
<rect x="626" y="119" width="154" height="3" rx="1.5" fill="#363950"/><rect x="626" y="119" width="154" height="3" rx="1.5" fill="url(#aurora)"><animate attributeName="width" values="0;154;154;0" keyTimes="0;.85;.98;1" begin="0s" dur="4s" repeatCount="indefinite"/></rect><rect x="790" y="119" width="154" height="3" rx="1.5" fill="#363950"/><rect x="790" y="119" width="154" height="3" rx="1.5" fill="url(#aurora)"><animate attributeName="width" values="0;154;154;0" keyTimes="0;.85;.98;1" begin="4s" dur="4s" repeatCount="indefinite"/></rect><rect x="954" y="119" width="154" height="3" rx="1.5" fill="#363950"/><rect x="954" y="119" width="154" height="3" rx="1.5" fill="url(#aurora)"><animate attributeName="width" values="0;154;154;0" keyTimes="0;.85;.98;1" begin="8s" dur="4s" repeatCount="indefinite"/></rect><g opacity="1"><animate attributeName="opacity" values="1;1;1;1;0" keyTimes="0;.22;.3;.68;.78" begin="0s" dur="12s" repeatCount="indefinite"/><rect x="626" y="139" width="516" height="115" rx="16" fill="#171a2b"/><circle cx="687" cy="196" r="35" fill="#171a2b" stroke="#22d3ee"/><text x="687" y="205" text-anchor="middle" font-size="30" fill="#22d3ee">⌨</text><text x="742" y="184" font-size="18" font-weight="700" fill="#f5f6ff">Vibe coding</text><text x="742" y="207" font-size="12" fill="#a2a6bd">Ideas in, prototypes out.</text><text x="742" y="227" font-size="12" fill="#a2a6bd">Curiosity is part of the workflow.</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.22;.3;.68;.78" begin="4s" dur="12s" repeatCount="indefinite"/><rect x="626" y="139" width="516" height="115" rx="16" fill="#171a2b"/><circle cx="687" cy="196" r="35" fill="#171a2b" stroke="#a78bfa"/><text x="687" y="205" text-anchor="middle" font-size="30" fill="#a78bfa">☁</text><text x="742" y="184" font-size="18" font-weight="700" fill="#f5f6ff">Cloud & DevOps</text><text x="742" y="207" font-size="12" fill="#a2a6bd">Automating the path from code</text><text x="742" y="227" font-size="12" fill="#a2a6bd">to a reliable deployment.</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.22;.3;.68;.78" begin="8s" dur="12s" repeatCount="indefinite"/><rect x="626" y="139" width="516" height="115" rx="16" fill="#171a2b"/><circle cx="687" cy="196" r="35" fill="#171a2b" stroke="#f472b6"/><text x="687" y="205" text-anchor="middle" font-size="30" fill="#f472b6">✦</text><text x="742" y="184" font-size="18" font-weight="700" fill="#f5f6ff">Creative experiments</text><text x="742" y="207" font-size="12" fill="#a2a6bd">Trying new tools, motion and</text><text x="742" y="227" font-size="12" fill="#a2a6bd">details that make UI feel alive.</text></g><text x="626" y="284" font-size="11" fill="#7f86a5" class="mono">ROTATING INTERESTS · 4 SECOND CADENCE</text><text x="626" y="326" class="label" fill="#22d3ee">DAILY RINGS</text><g transform="translate(690 390)"><circle r="32" fill="none" stroke="#292d43" stroke-width="7"/><circle r="32" fill="none" stroke="#22d3ee" stroke-width="7" stroke-linecap="round" stroke-dasharray="145 201" transform="rotate(-90)" filter="url(#glow)"><animate attributeName="stroke-dasharray" values="0 201;145 201;145 201;0 201" keyTimes="0;.55;.9;1" dur="4s" begin="0.0s" repeatCount="indefinite"/></circle><text y="5" text-anchor="middle" font-size="14" font-weight="700" fill="#f5f6ff">01</text><text y="52" text-anchor="middle" font-size="11" fill="#a2a6bd">Build</text></g><g transform="translate(848 390)"><circle r="32" fill="none" stroke="#292d43" stroke-width="7"/><circle r="32" fill="none" stroke="#a78bfa" stroke-width="7" stroke-linecap="round" stroke-dasharray="165 201" transform="rotate(-90)" filter="url(#glow)"><animate attributeName="stroke-dasharray" values="0 201;165 201;165 201;0 201" keyTimes="0;.55;.9;1" dur="4s" begin="0.3s" repeatCount="indefinite"/></circle><text y="5" text-anchor="middle" font-size="14" font-weight="700" fill="#f5f6ff">02</text><text y="52" text-anchor="middle" font-size="11" fill="#a2a6bd">Explore</text></g><g transform="translate(1006 390)"><circle r="32" fill="none" stroke="#292d43" stroke-width="7"/><circle r="32" fill="none" stroke="#f472b6" stroke-width="7" stroke-linecap="round" stroke-dasharray="125 201" transform="rotate(-90)" filter="url(#glow)"><animate attributeName="stroke-dasharray" values="0 201;125 201;125 201;0 201" keyTimes="0;.55;.9;1" dur="4s" begin="0.6s" repeatCount="indefinite"/></circle><text y="5" text-anchor="middle" font-size="14" font-weight="700" fill="#f5f6ff">03</text><text y="52" text-anchor="middle" font-size="11" fill="#a2a6bd">Ship</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="500" viewBox="0 0 1200 500"><title>Thanga Paresh T — animated GitHub profile</title>
<defs>
<linearGradient id="aurora"><stop stop-color="#22d3ee"/><stop offset=".52" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
<linearGradient id="txt" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset=".55" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171a2a"/><stop offset="1" stop-color="#0d0e16"/></linearGradient>
<pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r=".8" fill="#c4c8e8" opacity=".13"/></pattern>
<filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
text{font-family:Inter,"Segoe UI",Arial,sans-serif}.mono{font-family:Consolas,monospace;letter-spacing:.4px}
.muted{fill:#a2a6bd}.white{fill:#f5f6ff}.card{fill:url(#glass);stroke:#a78bfa;stroke-opacity:.28}
.hair{fill:none;stroke:url(#aurora);stroke-width:1.2}.label{font-size:12px;letter-spacing:1.8px}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.entrance{animation:enter .8s ease-out both}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="500" fill="#0d0e16"/><rect width="1200" height="500" fill="url(#dots)"/>
